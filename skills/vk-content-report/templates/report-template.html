<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title><!--TITLE--></title>
<style>
  body { font-family: Georgia, "Times New Roman", serif; max-width: 860px; margin: 0 auto;
         padding: 24px 20px 64px; color: #1d2733; line-height: 1.55; }
  header { border-bottom: 3px solid #1d2733; padding-bottom: 12px; margin-bottom: 28px; }
  h1 { font-size: 26px; margin: 0 0 6px; }
  .subtitle { color: #5a6675; font-size: 15px; margin: 0 0 4px; }
  .generated { color: #8b96a5; font-size: 13px; }
  /* Смысловые блоки идут строго вертикально, один под другим. Колонки запрещены. */
  section.block { margin: 0 0 34px; padding: 0; }
  h2 { font-size: 20px; border-left: 5px solid #2f6fb2; padding-left: 10px; margin: 0 0 14px; }
  h4 { font-size: 15px; margin: 0 0 6px; color: #2f4256; }
  p { margin: 0 0 10px; font-size: 15px; }
  table { border-collapse: collapse; width: 100%; font-size: 14px; }
  th, td { border: 1px solid #cfd8e3; padding: 6px 9px; text-align: left; }
  thead th { background: #eef3f8; }
  .card, .signal, .conclusion, .clip-card {
      border: 1px solid #d7dee6; border-radius: 8px; padding: 12px 14px; margin: 0 0 14px;
      background: #fbfcfe; }
  .card.top { border-left: 5px solid #2e8b57; }
  .card.bottom { border-left: 5px solid #b25b2f; }
  .clip-card { border-left: 5px solid #7a4fb2; }
  .first-line { font-style: italic; color: #3c4a5a; }
  .metrics { font-size: 13px; color: #5a6675; }
  ul.evidence { list-style: none; padding: 0; margin: 6px 0 0; }
  ul.evidence li { font-size: 13px; margin: 0 0 5px; }
  a.evidence-link { color: #1a5fb4; word-break: break-all; }
  .quote { color: #4a5768; }
  .src { color: #8b96a5; font-size: 12px; }
  .note { font-size: 13px; color: #5a6675; background: #f2f5f9; padding: 8px 10px;
          border-radius: 6px; }
</style>
</head>
<body>
<header>
  <h1><!--TITLE--></h1>
  <p class="subtitle"><!--SUBTITLE--></p>
  <p class="generated">Отчёт собран: <!--GENERATED--> (МСК). Только наблюдения и выводы,
     подтверждённые данными. Рекомендаций нет.</p>
</header>

<!--SECTIONS-->

</body>
</html>
